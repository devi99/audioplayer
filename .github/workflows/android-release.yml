name: Build Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Android platform
        run: flutter config --enable-android

      - name: Install Dart and Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Rename APK artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk audioplayer-android-release.apk

      - name: Rename App Bundle artifact
        run: |
          mv build/app/outputs/bundle/release/app-release.aab audioplayer-android-release.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: audioplayer-android-release
          path: |
            audioplayer-android-release.apk
            audioplayer-android-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            audioplayer-android-release.apk
            audioplayer-android-release.aab
          generate_release_notes: true